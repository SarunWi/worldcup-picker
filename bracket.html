<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บราเก็ต World Cup 2026</title>
    <script src="teams.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:    #0d1b2a;
            --card:  #162231;
            --bord:  #243447;
            --green: #4caf50;
            --gold:  #ffd700;
            --text:  #dce8f0;
            --muted: #5a7080;
            --line:  #2a4055;
            --COL:   156px;
            --GAP:   32px;
            --ARM:   16px;   /* half of GAP */
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

        /* ── Header ──────────────────────────────────── */
        header { background: linear-gradient(135deg, #071810, #0f2a14); border-bottom: 2px solid var(--green); padding: 14px 20px; }
        .header-inner { max-width: 1800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 1.4rem; font-weight: 700; }
        .header-sub { color: var(--muted); font-size: .78rem; margin-top: 3px; }
        .btn { background: #1a2e3e; border: 1px solid var(--bord); color: var(--text); padding: 7px 14px; border-radius: 7px; text-decoration: none; font-size: .82rem; cursor: pointer; white-space: nowrap; }
        .btn:hover { border-color: var(--green); }
        .hdr-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* ── Legend ──────────────────────────────────── */
        .legend { padding: 10px 20px 2px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .68rem; color: var(--muted); }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .l-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

        /* ── Bracket scroll wrapper ───────────────────── */
        .bracket-wrap { overflow-x: auto; padding: 10px 20px 24px; }

        /* Labels row */
        .blabels { display: flex; align-items: flex-end; padding-bottom: 6px; min-width: max-content; }
        .blabel { width: var(--COL); flex-shrink: 0; text-align: center; font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding: 0 2px; }
        .blabel.final-lbl { color: var(--gold); }
        .blabel-gap { width: var(--GAP); flex-shrink: 0; }

        /* ── Main bracket ────────────────────────────── */
        .bracket { display: flex; align-items: stretch; min-height: 620px; min-width: max-content; }

        /* Left and right halves */
        .lh, .rh { display: flex; align-items: stretch; }

        /* A column for one round */
        .rcol { width: var(--COL); flex-shrink: 0; display: flex; flex-direction: column; }

        /* Gap spacer between round columns */
        .rgap { width: var(--GAP); flex-shrink: 0; }

        /* A group of 2 matches that produce 1 next-round slot */
        .mpair { position: relative; display: flex; flex-direction: column; flex: 1; }

        /* ── Bracket arm (vertical connector) ────────── */
        /* Left half: arm on the RIGHT */
        .lh .mpair.arm::after {
            content: ''; position: absolute;
            right: calc(-1 * var(--ARM)); top: 25%; height: 50%;
            border-right: 2px solid var(--line); pointer-events: none;
        }
        /* Right half: arm on the LEFT */
        .rh .mpair.arm::after {
            content: ''; position: absolute;
            left: calc(-1 * var(--ARM)); top: 25%; height: 50%;
            border-left: 2px solid var(--line); pointer-events: none;
        }

        /* Slot that wraps one match card */
        .mslot { flex: 1; display: flex; align-items: center; padding: 4px 0; position: relative; }

        /* ── Horizontal connectors ────────────────────── */
        /* Left half: each match sends line RIGHT to arm */
        .lh .mslot.out::after {
            content: ''; position: absolute;
            right: calc(-1 * var(--ARM)); top: 50%;
            width: var(--ARM); border-top: 2px solid var(--line); pointer-events: none;
        }
        /* Left half: each match receives line from arm on LEFT */
        .lh .mslot.in::before {
            content: ''; position: absolute;
            left: calc(-1 * var(--ARM)); top: 50%;
            width: var(--ARM); border-top: 2px solid var(--line); pointer-events: none;
        }
        /* Right half: each match sends line LEFT to arm */
        .rh .mslot.out::after {
            content: ''; position: absolute;
            left: calc(-1 * var(--ARM)); top: 50%;
            width: var(--ARM); border-top: 2px solid var(--line); pointer-events: none;
        }
        /* Right half: each match receives line from arm on RIGHT */
        .rh .mslot.in::before {
            content: ''; position: absolute;
            right: calc(-1 * var(--ARM)); top: 50%;
            width: var(--ARM); border-top: 2px solid var(--line); pointer-events: none;
        }

        /* ── Match card ──────────────────────────────── */
        .mcard { width: 100%; background: var(--card); border: 1px solid var(--bord); border-radius: 8px; overflow: hidden; }
        .mdate { font-size: .5rem; color: var(--muted); text-align: center; padding: 3px 4px 2px; background: rgba(0,0,0,.2); border-bottom: 1px solid var(--bord); }
        .mteam { display: flex; align-items: center; gap: 5px; padding: 5px 7px; min-height: 28px; }
        .mteam + .mteam { border-top: 1px solid rgba(255,255,255,.05); }
        .mteam.tw { background: rgba(255,215,0,.07); }
        .mteam.tl { opacity: .42; }

        .tflag { width: 20px; height: auto; border-radius: 2px; flex-shrink: 0; display: block; }
        .tph   { width: 20px; height: 13px; background: #1e3045; border-radius: 2px; flex-shrink: 0; }
        .tname { flex: 1; font-size: .64rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tname.tbd { color: var(--muted); font-style: italic; font-weight: 400; font-size: .58rem; }
        .tscore { font-weight: 800; font-size: .68rem; flex-shrink: 0; min-width: 12px; text-align: right; }
        .tscore.w { color: var(--gold); }
        .towner { font-size: .46rem; font-weight: 700; flex-shrink: 0; padding: 1px 3px; border-radius: 3px; background: rgba(0,0,0,.3); white-space: nowrap; }

        /* ── Final (center column) ────────────────────── */
        .final-col {
            width: var(--COL); flex-shrink: 0;
            display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 6px;
        }
        .trophy { text-align: center; font-size: 1.6rem; }

        /* Final card receives a connector from BOTH sides */
        .final-wrap {
            position: relative;
            display: flex; align-items: center;
        }
        /* Left connector: from SF-101 */
        .final-wrap::before {
            content: ''; position: absolute;
            left: calc(-1 * var(--ARM)); top: 50%;
            width: var(--ARM); border-top: 2px solid var(--line); pointer-events: none;
        }
        /* Right connector: from SF-102 */
        .final-wrap::after {
            content: ''; position: absolute;
            right: calc(-1 * var(--ARM)); top: 50%;
            width: var(--ARM); border-top: 2px solid var(--line); pointer-events: none;
        }

        /* ── 3rd place section ────────────────────────── */
        .third-sec { padding: 10px 20px 28px; }
        .third-lbl { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
        .third-card-wrap { max-width: 200px; }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div>
            <h1 id="h-title">🏆 บราเก็ต World Cup 2026</h1>
            <div class="header-sub" id="h-sub">รอบ 32 ทีม → รอบชิงชนะเลิศ</div>
        </div>
        <div class="hdr-btns">
            <a class="btn" href="scoreboard.html" id="h-score">📊 ตาราง</a>
            <a class="btn" href="worst.html">💀 Worst Pick</a>
            <a class="btn" href="index.html" id="h-pick">🎡 จับฉลาก</a>
            <button class="btn" id="langBtn" onclick="toggleLang()">EN</button>
        </div>
    </div>
</header>

<div class="legend" id="legend"></div>
<div class="bracket-wrap">
    <div class="blabels" id="blabels"></div>
    <div class="bracket" id="bracket"></div>
</div>
<div class="third-sec">
    <div class="third-lbl" id="thirdLbl">🥉 Third Place Match</div>
    <div class="third-card-wrap" id="thirdCard"></div>
</div>

<script>
// ── Players ────────────────────────────────────────────────────
const PLAYERS = [
    { name:"ก้อง", en:"Kong",    teams:["Belgium","Morocco","Qatar","DR Congo"],             color:"#4fc3f7" },
    { name:"แว่น", en:"OakVaan", teams:["Argentina","Japan","Scotland","New Zealand"],        color:"#81c784" },
    { name:"มิว",  en:"Mew",     teams:["France","Uruguay","Tunisia","Cabo Verde"],           color:"#ff8a65" },
    { name:"นุ",   en:"Nuu",     teams:["Spain","Croatia","South Africa","Jordan"],           color:"#f48fb1" },
    { name:"ตือ",  en:"Oou",     teams:["Germany","Australia","Algeria","Ghana"],             color:"#ce93d8" },
    { name:"พิม",  en:"Pim",     teams:["England","Austria","Paraguay","Curaçao"],            color:"#ffb74d" },
    { name:"บลู",  en:"Chablue", teams:["Netherlands","Switzerland","Norway","Haiti"],        color:"#4db6ac" },
    { name:"อาม",  en:"Arm",     teams:["Portugal","Senegal","Uzbekistan","Iraq"],            color:"#aed581" },
    { name:"เรีย", en:"Lea",     teams:["Brazil","Ecuador","Egypt","Turkey"],                 color:"#7986cb" },
];
const OWNER = {};
PLAYERS.forEach(p => p.teams.forEach(t => OWNER[t] = p));

// ── Flag codes ─────────────────────────────────────────────────
const FLAG = {
    "South Africa":"za","Canada":"ca","Germany":"de","Paraguay":"py",
    "Netherlands":"nl","Morocco":"ma","Brazil":"br","Japan":"jp",
    "France":"fr","Sweden":"se","Ivory Coast":"ci","Norway":"no",
    "Mexico":"mx","Ecuador":"ec","England":"gb-eng","DR Congo":"cd",
    "USA":"us","Bosnia":"ba","Belgium":"be","Senegal":"sn",
    "Portugal":"pt","Croatia":"hr","Spain":"es","Austria":"at",
    "Switzerland":"ch","Algeria":"dz","Argentina":"ar","Cabo Verde":"cv",
    "Colombia":"co","Ghana":"gh","Australia":"au","Egypt":"eg",
};

// ── Match data ─────────────────────────────────────────────────
// score: "G1-G2" or null; penWinner: team name if went to pens
const MATCHES = {
    // Round of 32
    73:  { date:"Jun 28", t1:"South Africa", t2:"Canada",      score:"0-1" },
    74:  { date:"Jun 29", t1:"Germany",      t2:"Paraguay",    score:"1-1", penWinner:"Paraguay" },
    75:  { date:"Jun 29", t1:"Netherlands",  t2:"Morocco",     score:"1-1", penWinner:"Morocco" },
    76:  { date:"Jun 29", t1:"Brazil",       t2:"Japan",       score:"2-1" },
    77:  { date:"Jun 30", t1:"France",       t2:"Sweden",      score:"3-0" },
    78:  { date:"Jun 30", t1:"Ivory Coast",  t2:"Norway",      score:"1-2" },
    79:  { date:"Jun 30", t1:"Mexico",       t2:"Ecuador",     score:"2-0" },
    80:  { date:"Jul 1",  t1:"England",      t2:"DR Congo",    score:"2-1" },
    81:  { date:"Jul 1",  t1:"USA",          t2:"Bosnia",      score:"2-0" },
    82:  { date:"Jul 1",  t1:"Belgium",      t2:"Senegal",     score:"3-2" },
    83:  { date:"Jul 2",  t1:"Portugal",     t2:"Croatia",     score:"2-1" },
    84:  { date:"Jul 2",  t1:"Spain",        t2:"Austria",     score:"3-0" },
    85:  { date:"Jul 2",  t1:"Switzerland",  t2:"Algeria",     score:"2-0" },
    86:  { date:"Jul 3",  t1:"Argentina",    t2:"Cabo Verde",  score:"3-2" },
    87:  { date:"Jul 3",  t1:"Colombia",     t2:"Ghana",       score:"1-0" },
    88:  { date:"Jul 3",  t1:"Australia",    t2:"Egypt",       score:"1-1", penWinner:"Egypt" },
    // Round of 16
    89:  { date:"Jul 4",  from:[74,77],  score:"0-1" },
    90:  { date:"Jul 4",  from:[73,75],  score:"0-3" },
    91:  { date:"Jul 5",  from:[76,78],  score:"1-2" },
    92:  { date:"Jul 5",  from:[79,80],  score:"2-3" },
    93:  { date:"Jul 6",  from:[83,84],  score:"0-1" },
    94:  { date:"Jul 6",  from:[81,82],  score:"1-4" },
    95:  { date:"Jul 7",  from:[86,88],  score:"3-2" },
    96:  { date:"Jul 7",  from:[85,87],  score:"0-0", penWinner:"Switzerland" },
    // Quarterfinals
    97:  { date:"Jul 9",  from:[89,90],  score:"2-0" },
    98:  { date:"Jul 10", from:[93,94],  score:"2-1" },
    99:  { date:"Jul 11", from:[91,92],  score:"1-2" },
    100: { date:"Jul 11", from:[95,96],  score:"3-1" },
    // Semifinals
    101: { date:"Jul 14", from:[97,98],  score:null },
    102: { date:"Jul 15", from:[99,100], score:null },
    // 3rd place & Final
    103: { date:"Jul 18", from:[101,102], score:null },
    104: { date:"Jul 19", from:[101,102], score:null },
};

// ── Bracket layout ─────────────────────────────────────────────
//
// Left half (→):  R32L | R16L | QFL | SFL
//                   ↓     ↓     ↓     ↓ → FINAL ← ↑    ↑     ↑     ↑
// Right half (←): R32R | R16R | QFR | SFR        SFR | QFR | R16R | R32R
//
// LEFT_ROUNDS: columns ordered left→right (R32 first)
// RIGHT_ROUNDS: columns ordered left→right (SF first, closest to center)

const LEFT_ROUNDS = [
    { label:"Round of 32", pairs:[[73,75],[74,77],[81,82],[83,84]] },
    { label:"Round of 16", pairs:[[90,89],[94,93]] },
    { label:"Quarterfinal", pairs:[[97,98]] },
    { label:"Semifinal",    pairs:[[101]] },       // solo — no arm
];
const RIGHT_ROUNDS = [
    { label:"Semifinal",    pairs:[[102]] },       // solo — no arm
    { label:"Quarterfinal", pairs:[[99,100]] },
    { label:"Round of 16", pairs:[[91,92],[96,95]] },
    { label:"Round of 32", pairs:[[76,78],[79,80],[85,87],[86,88]] },
];

// ── Winner helpers ─────────────────────────────────────────────
function getTeams(id) {
    const m = MATCHES[id];
    if (m.t1 !== undefined) return { t1: m.t1, t2: m.t2 };
    return { t1: getWinner(m.from[0]), t2: getWinner(m.from[1]) };
}
function getWinner(id) {
    const m = MATCHES[id];
    if (m.penWinner) return m.penWinner;
    if (!m.score) return null;
    const [a, b] = m.score.split('-').map(Number);
    const { t1, t2 } = getTeams(id);
    return a > b ? t1 : b > a ? t2 : null;
}
function getLoser(id) {
    const w = getWinner(id);
    if (!w) return null;
    const { t1, t2 } = getTeams(id);
    return w === t1 ? t2 : t1;
}

// ── Rendering helpers ──────────────────────────────────────────
let lang = localStorage.getItem('wc-lang') || 'th';
function toggleLang() {
    lang = lang === 'th' ? 'en' : 'th';
    localStorage.setItem('wc-lang', lang);
    render();
}

function flagHtml(team) {
    if (!team) return '<div class="tph"></div>';
    const code = FLAG[team];
    return code
        ? `<img class="tflag" src="https://flagcdn.com/w40/${code}.png" onerror="this.style.opacity=.15" alt="">`
        : '<div class="tph"></div>';
}

const SHORT = {
    "South Africa":"S. Africa","Netherlands":"Neth.","Ivory Coast":"Iv. Coast",
    "Switzerland":"Swiss","Cabo Verde":"Cabo V.","DR Congo":"DR Congo",
};
function nameHtml(team) {
    if (!team) return `<span class="tname tbd">TBD</span>`;
    return `<span class="tname">${SHORT[team] || team}</span>`;
}
function ownerHtml(team) {
    if (!team) return '';
    const p = OWNER[team];
    if (!p) return '';
    return `<span class="towner" style="color:${p.color}">${lang === 'th' ? p.name : p.en}</span>`;
}

function renderCard(id) {
    const m = MATCHES[id];
    const { t1, t2 } = getTeams(id);
    const winner = m.score ? getWinner(id) : null;
    const [s1, s2] = m.score ? m.score.split('-').map(Number) : [null, null];

    function row(team, score) {
        const isW = winner && team && team === winner;
        const isL = winner && team && team !== winner;
        const wdlCls = isW ? ' tw' : isL ? ' tl' : '';
        const sCls   = isW ? ' w' : '';
        return `<div class="mteam${wdlCls}">
            ${flagHtml(team)}
            ${nameHtml(team)}
            ${ownerHtml(team)}
            ${score !== null ? `<span class="tscore${sCls}">${score}</span>` : ''}
        </div>`;
    }

    return `<div class="mcard">
        <div class="mdate">${m.date}</div>
        ${row(t1, s1)}
        ${row(t2, s2)}
    </div>`;
}

// ── Build bracket HTML ─────────────────────────────────────────
function buildHalf(rounds, side) {
    // side: 'lh' or 'rh'
    // A pair with 1 match is a solo slot (no arm, no pair wrapper needed)
    let html = `<div class="${side}">`;
    rounds.forEach((round, ri) => {
        const totalRounds = rounds.length;
        const isFirst = ri === 0;
        const isLast  = ri === totalRounds - 1;

        if (!isFirst) html += `<div class="rgap"></div>`;

        html += `<div class="rcol">`;
        round.pairs.forEach(pair => {
            const isSolo = pair.length === 1;
            html += isSolo
                ? `<div class="mpair">`
                : `<div class="mpair arm">`;

            pair.forEach(id => {
                // out: sends connector toward bracket arm
                // in:  receives connector from bracket arm of previous round
                const hasOut = !isLast;           // all except the outermost (SF solo) → actually even SF solo has "out" to the Final
                const hasIn  = side === 'lh' ? ri > 0 : ri < totalRounds - 1;
                // For SF solo in LH: out goes RIGHT to Final; in comes from QF arm
                // For SF solo in RH: out goes LEFT to Final; in comes from QF arm
                const outCls = 'out';
                const inCls  = hasIn ? ' in' : '';
                html += `<div class="mslot ${outCls}${inCls}">${renderCard(id)}</div>`;
            });

            html += `</div>`;
        });
        html += `</div>`;

        if (isLast) html += `<div class="rgap"></div>`;
    });
    html += `</div>`;
    return html;
}

// ── Main render ────────────────────────────────────────────────
function render() {
    // Header strings
    document.getElementById('langBtn').textContent  = lang === 'th' ? 'EN' : 'TH';
    document.getElementById('h-title').textContent  = lang === 'th' ? '🏆 บราเก็ต World Cup 2026' : '🏆 World Cup 2026 Bracket';
    document.getElementById('h-sub').textContent    = lang === 'th' ? 'รอบ 32 ทีม → รอบชิงชนะเลิศ' : 'Round of 32 → Final';
    document.getElementById('h-score').textContent  = lang === 'th' ? '📊 ตาราง' : '📊 Scoreboard';
    document.getElementById('h-pick').textContent   = lang === 'th' ? '🎡 จับฉลาก' : '🎡 Picker';
    document.getElementById('thirdLbl').textContent = lang === 'th' ? '🥉 อันดับสาม' : '🥉 Third Place';

    // Legend
    document.getElementById('legend').innerHTML = PLAYERS.map(p =>
        `<div class="legend-item"><div class="l-dot" style="background:${p.color}"></div>${lang === 'th' ? p.name : p.en}</div>`
    ).join('');

    // Labels row:
    // Left: R32 → gap → R16 → gap → QF → gap → SF → gap
    // Center: FINAL
    // Right: gap → SF → gap → QF → gap → R16 → gap → R32
    const lLabels = LEFT_ROUNDS.map(r =>
        `<div class="blabel">${r.label}</div><div class="blabel-gap"></div>`
    ).join('');
    const rLabels = RIGHT_ROUNDS.map(r =>
        `<div class="blabel-gap"></div><div class="blabel">${r.label}</div>`
    ).join('');
    document.getElementById('blabels').innerHTML =
        lLabels + `<div class="blabel final-lbl">⚽ Final</div>` + rLabels;

    // Bracket
    const finalHtml = `<div class="final-col">
        <div class="trophy">🏆</div>
        <div class="final-wrap">${renderCard(104)}</div>
    </div>`;

    document.getElementById('bracket').innerHTML =
        buildHalf(LEFT_ROUNDS, 'lh') + finalHtml + buildHalf(RIGHT_ROUNDS, 'rh');

    // 3rd place
    document.getElementById('thirdCard').innerHTML = renderCard(103);
}

render();
</script>
</body>
</html>
