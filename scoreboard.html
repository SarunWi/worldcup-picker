<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เชียร์บอลโลก 2026</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:     #0d1b2a;
            --card:   #162231;
            --border: #243447;
            --green:  #4caf50;
            --gold:   #ffd700;
            --text:   #dce8f0;
            --muted:  #5a7080;
            --yellow: #f9a825;
            --red:    #e53935;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

        /* ── Header ─────────────────────────────────────────── */
        header {
            background: linear-gradient(135deg, #071810, #0f2a14);
            border-bottom: 2px solid var(--green);
            padding: 14px 20px;
        }
        .header-inner {
            max-width: 1200px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        header h1 { font-size: 1.4rem; font-weight: 700; }
        .header-sub { color: var(--muted); font-size: .78rem; margin-top: 3px; }
        .back-btn {
            background: #1a2e3e; border: 1px solid var(--border);
            color: var(--text); padding: 7px 14px; border-radius: 7px;
            text-decoration: none; font-size: .82rem;
        }
        .back-btn:hover { border-color: var(--green); }

        /* ── Main ────────────────────────────────────────────── */
        .main { max-width: 1200px; margin: 0 auto; padding: 16px; }

        .legend {
            display: flex; align-items: center; gap: 16px; margin-bottom: 12px;
            font-size: .75rem; color: var(--muted); flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .ldot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .ldot-q { background: var(--green); }
        .ldot-a { background: var(--yellow); }
        .ldot-e { background: #444; }
        .legend-hint { margin-left: auto; font-size: .72rem; }

        /* ── Board ───────────────────────────────────────────── */
        .board-header {
            display: grid;
            grid-template-columns: 88px repeat(4, 1fr) 82px;
            gap: 6px; padding: 0 6px 4px;
            font-size: .65rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--muted); text-align: center;
        }
        .board-header .bh-left { text-align: left; }
        .board { display: flex; flex-direction: column; gap: 6px; }

        /* ── Player row ──────────────────────────────────────── */
        .player-row {
            display: grid;
            grid-template-columns: 88px repeat(4, 1fr) 82px;
            gap: 6px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            align-items: stretch;
        }
        .player-name {
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .92rem; text-align: center; padding: 4px 2px;
        }
        .teams-wrap { display: contents; }

        /* ── Team card ───────────────────────────────────────── */
        .team-card {
            position: relative;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            transition: all .15s;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .team-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
        .team-card:active { transform: translateY(0); }
        .team-card.s-qualified { border-color: var(--green); background: rgba(76,175,80,.07); }
        .team-card.s-alive     { border-color: rgba(249,168,37,.45); }
        .team-card.s-eliminated { opacity: .38; filter: grayscale(.6); }

        .pot-lbl {
            position: absolute; top: 4px; left: 5px;
            font-size: .55rem; color: var(--muted); font-weight: 700;
        }

        /* ── Card left (flag + group + badge) ───────────────── */
        .card-left {
            display: flex; flex-direction: column; align-items: center;
            flex-shrink: 0; width: 54px; text-align: center;
        }
        .team-flag  { width: 44px; height: auto; margin-bottom: 4px; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.4); display: block; }
        .team-group { font-size: .58rem; color: var(--muted); margin-top: 1px; }
        .team-badge {
            margin-top: 5px; display: inline-block;
            padding: 2px 5px; border-radius: 10px;
            font-size: .55rem; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
        }
        .s-qualified .team-badge { background: rgba(76,175,80,.18); color: var(--green); }
        .s-alive     .team-badge { background: rgba(249,168,37,.15); color: var(--yellow); }
        .s-eliminated .team-badge { background: rgba(60,60,60,.3); color: #666; }

        /* ── Card right (matches + %) ────────────────────────── */
        .card-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .card-match {
            display: flex; align-items: center; gap: 3px;
            font-size: .6rem; white-space: nowrap; overflow: hidden;
        }
        .card-next { color: var(--muted); }
        .card-date { font-size: .55rem; color: var(--muted); min-width: 34px; flex-shrink: 0; }
        .card-vs   { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .card-score { font-weight: 700; flex-shrink: 0; }
        .card-wdl  {
            font-size: .52rem; font-weight: 900; padding: 1px 3px;
            border-radius: 3px; flex-shrink: 0;
        }
        .card-pct {
            display: flex; align-items: center; gap: 5px;
            margin-top: 4px; padding-top: 4px;
            border-top: 1px solid rgba(255,255,255,.06);
        }
        .card-pct-bar-wrap {
            flex: 1; height: 4px; background: rgba(255,255,255,.07);
            border-radius: 2px; overflow: hidden;
        }
        .card-pct-bar  { height: 100%; border-radius: 2px; }
        .card-pct-num  { font-size: .65rem; font-weight: 800; min-width: 30px; text-align: right; flex-shrink: 0; }

        /* ── Score cell ──────────────────────────────────────── */
        .score-cell {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 2px;
        }
        .score-big   { font-size: 2.2rem; font-weight: 900; color: var(--gold); line-height: 1; }
        .score-sub   { font-size: .6rem; color: var(--muted); }
        .score-detail { font-size: .62rem; color: var(--muted); margin-top: 3px; }

        /* ── Popup overlay ───────────────────────────────────── */
        .popup-overlay {
            display: none; position: fixed; inset: 0; z-index: 200;
        }
        .popup-overlay.active { display: block; }

        .popup {
            position: fixed;
            z-index: 201;
            width: 268px;
            background: #182d42;
            border: 1px solid #2d4a62;
            border-radius: 13px;
            padding: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,.6);
            font-size: .82rem;
        }
        .popup-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        }
        .popup-flag    { width: 52px; height: auto; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.4); flex-shrink: 0; }
        .popup-title   { font-weight: 700; font-size: .95rem; }
        .popup-sub     { font-size: .63rem; color: var(--muted); margin-top: 1px; }
        .popup-close {
            margin-left: auto; background: none; border: none;
            color: var(--muted); font-size: 1.3rem; cursor: pointer;
            padding: 0 2px; line-height: 1; flex-shrink: 0;
        }
        .popup-close:hover { color: var(--text); }

        .popup-section { margin-bottom: 10px; }
        .popup-section:last-child { margin-bottom: 0; }
        .popup-section-title {
            font-size: .65rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--muted); margin-bottom: 6px;
        }
        .popup-match {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.04);
            font-size: .78rem;
        }
        .popup-match:last-child { border-bottom: none; }
        .popup-date  { color: var(--muted); font-size: .68rem; min-width: 44px; flex-shrink: 0; }
        .popup-score { margin-left: auto; font-weight: 700; font-size: .78rem; }
        .popup-wdl   { font-size: .6rem; font-weight: 900; padding: 1px 4px; border-radius: 4px; }
        .wdl-W { background: rgba(76,175,80,.2); color: var(--green); }
        .wdl-D { background: rgba(249,168,37,.15); color: var(--yellow); }
        .wdl-L { background: rgba(229,57,53,.2); color: var(--red); }

        .today-badge {
            font-size: .6rem; font-weight: 700; background: rgba(255,215,0,.15);
            color: var(--gold); padding: 1px 5px; border-radius: 4px;
        }

        .pct-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .pct-bar-wrap {
            flex: 1; height: 7px; background: rgba(255,255,255,.07);
            border-radius: 4px; overflow: hidden;
        }
        .pct-bar { height: 100%; border-radius: 4px; transition: width .4s ease; }
        .pct-num { font-weight: 800; font-size: .85rem; min-width: 38px; text-align: right; }

        /* ── Filter bar ──────────────────────────────────────── */
        .filter-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .filter-input {
            flex: 1; max-width: 280px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 7px 12px; border-radius: 8px;
            font-size: .85rem; outline: none; font-family: inherit;
        }
        .filter-input:focus { border-color: var(--green); }
        .filter-input::placeholder { color: var(--muted); }
        .filter-clear {
            background: none; border: none; color: var(--muted);
            font-size: 1.1rem; cursor: pointer; padding: 2px 6px;
            border-radius: 6px; line-height: 1;
        }
        .filter-clear:hover { color: var(--text); background: var(--card); }
        .group-chips { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .chip-label { font-size: .72rem; color: var(--muted); margin-right: 2px; white-space: nowrap; }
        .group-chip {
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 3px 10px; border-radius: 20px;
            font-size: .78rem; font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .group-chip:hover { border-color: var(--green); }
        .group-chip.active { background: var(--green); border-color: var(--green); color: #000; }
        .extras-section { margin-top: 14px; }
        .extras-header {
            font-size: .7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; padding-left: 2px;
        }
        .extras-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
        .extra-card { opacity: .82; }
        .extra-card:hover { opacity: 1; }

        /* ── Footer ──────────────────────────────────────────── */
        .footer {
            text-align: center; color: var(--muted); font-size: .73rem;
            margin-top: 18px; padding-bottom: 20px;
        }

        /* ── Lang toggle ─────────────────────────────────────── */
        .lang-btn {
            background: #1a2e3e; border: 1px solid var(--border);
            color: var(--text); padding: 7px 14px; border-radius: 7px;
            font-size: .82rem; cursor: pointer; font-weight: 700; letter-spacing: 1px;
        }
        .lang-btn:hover { border-color: var(--green); }

        /* ── View toggle ─────────────────────────────────────── */
        .view-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
        .view-btn {
            background: var(--card); border: 1px solid var(--border);
            color: var(--muted); padding: 6px 14px; border-radius: 8px;
            font-size: .82rem; cursor: pointer; font-family: inherit; font-weight: 600;
        }
        .view-btn:hover { border-color: var(--green); color: var(--text); }
        .view-btn.active { background: rgba(76,175,80,.15); border-color: var(--green); color: var(--green); }

        /* ── Group standings view ────────────────────────────── */
        .group-standings { display: flex; flex-direction: column; gap: 12px; }
        .gs-section {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden;
        }
        .gs-header {
            padding: 8px 14px; font-size: .82rem; font-weight: 700;
            background: rgba(255,255,255,.04); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .gs-header-letter {
            background: var(--green); color: #000; font-size: .7rem; font-weight: 900;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .gs-cols {
            display: grid;
            grid-template-columns: 22px 1fr 70px 28px 28px 28px 28px 40px 36px;
            padding: 4px 10px;
            font-size: .58rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .8px; color: var(--muted);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .gs-cols span { text-align: center; }
        .gs-cols span:nth-child(2) { text-align: left; }
        .gs-row {
            display: grid;
            grid-template-columns: 22px 1fr 70px 28px 28px 28px 28px 40px 36px;
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,.04);
            align-items: center; cursor: pointer; transition: background .12s;
        }
        .gs-row:last-child { border-bottom: none; }
        .gs-row:hover { background: rgba(255,255,255,.04); }
        .gs-row.s-qualified { background: rgba(76,175,80,.05); }
        .gs-row.s-eliminated { opacity: .4; }
        .gs-qual-divider {
            height: 0; border-top: 2px dashed rgba(76,175,80,.35); margin: 0 10px;
        }
        .gs-rank { font-size: .72rem; font-weight: 700; color: var(--muted); text-align: center; }
        .gs-rank.top2 { color: var(--green); }
        .gs-team { display: flex; align-items: center; gap: 7px; overflow: hidden; }
        .gs-flag { width: 26px; height: auto; border-radius: 2px; flex-shrink: 0; }
        .gs-name { font-size: .78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gs-player { font-size: .65rem; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gs-player.owned { color: var(--gold); font-weight: 700; }
        .gs-stat { font-size: .75rem; text-align: center; }
        .gs-stat.pts { font-weight: 900; color: var(--text); font-size: .82rem; }
        .gs-stat.gd  { color: var(--muted); font-size: .68rem; }
        .gs-row-extra { opacity: .6; }

        /* ── Mobile ──────────────────────────────────────────── */
        @media (max-width: 780px) {
            .board-header { display: none; }
            .player-row { display: flex; flex-direction: column; gap: 8px; }
            .teams-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
            .player-name { justify-content: flex-start; font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
            .score-cell { flex-direction: row; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 8px; gap: 8px; }
            .score-big { font-size: 1.5rem; }
            .card-date { display: none; } /* too narrow on mobile */

            /* Group standings: collapse W/D/L and player on narrow screens */
            .gs-cols, .gs-row {
                grid-template-columns: 20px 1fr 28px 28px 40px 34px;
            }
            .gs-col-w, .gs-col-d, .gs-col-l, .gs-col-gd,
            .gs-stat-w, .gs-stat-d, .gs-stat-l, .gs-stat-gd,
            .gs-player { display: none; }

            /* Mobile popup: bottom sheet */
            .popup {
                width: 100%; left: 0 !important; right: 0;
                bottom: 0 !important; top: auto !important;
                border-radius: 18px 18px 0 0;
                transform: none !important;
                max-height: 70vh; overflow-y: auto;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div>
            <h1 id="h-title">🏆 เชียร์บอลโลก 2026</h1>
            <div class="header-sub" id="h-sub">สรุปสถานะทีม — เข้ารอบ 32 ทีม · คลิกที่ทีมเพื่อดูข้อมูล</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <a class="back-btn" id="h-back" href="index.html">← กลับหน้าจับฉลาก</a>
            <a class="back-btn" href="worst.html">💀 Worst Pick</a>
            <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
        </div>
    </div>
</header>

<!-- Popup overlay (clicking outside closes) -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
    <div class="popup" id="popup" onclick="event.stopPropagation()"></div>
</div>

<div class="main">
    <div class="legend">
        <span class="legend-item"><span class="ldot ldot-q"></span><span id="leg-q">เข้ารอบแล้ว</span></span>
        <span class="legend-item"><span class="ldot ldot-a"></span><span id="leg-a">ยังลุ้น</span></span>
        <span class="legend-item"><span class="ldot ldot-e"></span><span id="leg-e">ตกรอบ</span></span>
        <span class="legend-hint" id="leg-hint">คลิกที่การ์ดทีมเพื่อดูผลและโปรแกรม</span>
    </div>

    <div class="view-toggle">
        <button class="view-btn active" id="vBtnPlayer" onclick="setView('player')">👤 By Player</button>
        <button class="view-btn" id="vBtnGroup" onclick="setView('group')">📊 By Group</button>
        <button class="view-btn" id="vBtnRanking" onclick="setView('ranking')">🏅 By Pts</button>
    </div>

    <div class="filter-bar">
        <input class="filter-input" id="filterInput" type="text" autocomplete="off"
               placeholder="🔍 Filter by team…" oninput="setFilter(this.value)">
        <button class="filter-clear" id="filterClear" onclick="clearFilter()" style="display:none">✕</button>
    </div>

    <div class="group-chips" id="groupChips"></div>
    <div id="rankingChips" style="display:none;margin-bottom:10px">
        <button class="group-chip" id="aliveFilterBtn" onclick="toggleAliveFilter()">⚡ Alive only</button>
    </div>

    <div class="board-header" id="boardHeader">
        <div class="bh-left">ผู้เล่น</div>
        <div>ทีม 1</div><div>ทีม 2</div><div>ทีม 3</div><div>ทีม 4</div>
        <div>เข้ารอบ</div>
    </div>

    <div class="board" id="board">
        <div style="text-align:center;color:var(--muted);padding:48px">กำลังโหลด…</div>
    </div>

    <div id="extrasSection"></div>

    <div class="footer" id="footer"></div>
</div>

<script src="teams.js"></script>
<script>

// ── Static maps ─────────────────────────────────────────────────────────────
const FLAG_CODES = {
    "Belgium":"be","Morocco":"ma","Qatar":"qa","DR Congo":"cd",
    "Argentina":"ar","Japan":"jp","Scotland":"gb-sct","New Zealand":"nz",
    "France":"fr","Uruguay":"uy","Tunisia":"tn","Cabo Verde":"cv",
    "Spain":"es","Croatia":"hr","South Africa":"za","Jordan":"jo",
    "Germany":"de","Australia":"au","Algeria":"dz","Ghana":"gh",
    "England":"gb-eng","Austria":"at","Paraguay":"py","Curaçao":"cw",
    "Netherlands":"nl","Switzerland":"ch","Norway":"no","Haiti":"ht",
    "Portugal":"pt","Senegal":"sn","Uzbekistan":"uz","Iraq":"iq",
    "Brazil":"br","Ecuador":"ec","Egypt":"eg","Turkey":"tr",
    "Mexico":"mx","South Korea":"kr","Czechia":"cz",
    "Canada":"ca","Bosnia":"ba","USA":"us",
    "Ivory Coast":"ci","Sweden":"se","Iran":"ir",
    "Saudi Arabia":"sa","Colombia":"co","Panama":"pa"
};

function flagImg(name, cls) {
    const code = FLAG_CODES[name];
    if (!code) return `<span class="${cls}" style="font-size:1.6rem">🏳️</span>`;
    return `<img class="${cls}" src="https://flagcdn.com/w80/${code}.png" alt="${name}" loading="lazy">`;
}

const TODAY_DATE = "Jun 20";

// ── i18n ─────────────────────────────────────────────────────────────────────
const PLAYER_EN = {
    "ก้อง":"Kong","แว่น":"OakVaan","มิว":"Mew",
    "นุ":"Nuu","ตือ":"Oou","พิม":"Pim",
    "บลู":"Chablue","อาม":"Arm","เรีย":"Lea"
};

const STRINGS = {
    th: {
        title:      "เชียร์บอลโลก 2026",
        subtitle:   "สรุปสถานะทีม — เข้ารอบ 32 ทีม · คลิกที่ทีมเพื่อดูข้อมูล",
        backBtn:    "← กลับหน้าจับฉลาก",
        legendQ:    "เข้ารอบแล้ว", legendA: "ยังลุ้น", legendE: "ตกรอบ",
        legendHint: "คลิกที่การ์ดทีมเพื่อดูผลและโปรแกรม",
        colPlayer:  "ผู้เล่น", colTeam: n => `ทีม ${n}`, colQual: "เข้ารอบ",
        badgeQ: "✅ เข้ารอบ", badgeA: "🟡 ยังลุ้น", badgeE: "❌ ตกรอบ",
        group:      g => `กลุ่ม ${g}`,
        scoreSub:   "เข้ารอบ",
        scoreDetail:(a, e) => `${a} ลุ้น · ${e} ตก`,
        popupResults:  "📋 ผลการแข่งขัน",
        popupUpcoming: "📅 โปรแกรมต่อไป",
        popupOdds:     "📊 โอกาสเข้ารอบ 32 ทีม (FoxSports)",
        popupGroup:    (g, pot) => `กลุ่ม ${g} · Pot ${pot}`,
        lastUpdated:   d => `อัปเดตล่าสุด: ${d} · ข้อมูลโอกาส: FoxSports`,
    },
    en: {
        title:      "World Cup 2026 Tracker",
        subtitle:   "Team status — Round of 32 · Click a team for details",
        backBtn:    "← Back to picker",
        legendQ:    "Qualified", legendA: "In contention", legendE: "Eliminated",
        legendHint: "Click a team card for results and fixtures",
        colPlayer:  "Player", colTeam: n => `Team ${n}`, colQual: "Qualified",
        badgeQ: "✅ Qualified", badgeA: "🟡 Alive", badgeE: "❌ Out",
        group:      g => `Group ${g}`,
        scoreSub:   "qualified",
        scoreDetail:(a, e) => `${a} alive · ${e} out`,
        popupResults:  "📋 Results",
        popupUpcoming: "📅 Upcoming",
        popupOdds:     "📊 Qualify chance (FoxSports)",
        popupGroup:    (g, pot) => `Group ${g} · Pot ${pot}`,
        lastUpdated:   d => `Last updated: ${d} · Odds: FoxSports`,
    }
};

let lang = localStorage.getItem('wc-lang') || 'th';

function toggleLang() {
    lang = lang === 'th' ? 'en' : 'th';
    localStorage.setItem('wc-lang', lang);
    applyLang();
}

function applyLang() {
    const s = STRINGS[lang];
    document.getElementById('h-title').textContent  = '🏆 ' + s.title;
    document.getElementById('h-sub').textContent    = s.subtitle;
    document.getElementById('h-back').textContent   = s.backBtn;
    document.getElementById('leg-q').textContent    = s.legendQ;
    document.getElementById('leg-a').textContent    = s.legendA;
    document.getElementById('leg-e').textContent    = s.legendE;
    document.getElementById('leg-hint').textContent = s.legendHint;
    document.getElementById('langBtn').textContent  = lang === 'th' ? 'EN' : 'TH';
    document.getElementById('boardHeader').innerHTML =
        `<div class="bh-left">${s.colPlayer}</div>` +
        `<div>${s.colTeam(1)}</div><div>${s.colTeam(2)}</div><div>${s.colTeam(3)}</div><div>${s.colTeam(4)}</div>` +
        `<div>${s.colQual}</div>`;
    render();
}

// Player-team assignments — never changes after draft.
// Match data lives in teams.js (teamByName). Update that file only.
const SEED = {
    players: [
        { name:"ก้อง",  teams:["Belgium","Morocco","Qatar","DR Congo"] },
        { name:"แว่น",  teams:["Argentina","Japan","Scotland","New Zealand"] },
        { name:"มิว",   teams:["France","Uruguay","Tunisia","Cabo Verde"] },
        { name:"นุ",    teams:["Spain","Croatia","South Africa","Jordan"] },
        { name:"ตือ",   teams:["Germany","Australia","Algeria","Ghana"] },
        { name:"พิม",   teams:["England","Austria","Paraguay","Curaçao"] },
        { name:"บลู",   teams:["Netherlands","Switzerland","Norway","Haiti"] },
        { name:"อาม",   teams:["Portugal","Senegal","Uzbekistan","Iraq"] },
        { name:"เรีย",  teams:["Brazil","Ecuador","Egypt","Turkey"] },
    ],
    extras: ["Mexico","South Korea","Czechia","Canada","Bosnia","USA",
             "Ivory Coast","Sweden","Iran","Saudi Arabia","Colombia","Panama"],
};

// ── Helpers ─────────────────────────────────────────────────────────────────
function getStatus(pct) {
    if (pct >= 100) return 'qualified';
    if (pct <= 0)   return 'eliminated';
    return 'alive';
}

function pctColor(pct) {
    if (pct >= 80) return 'var(--green)';
    if (pct >= 40) return 'var(--yellow)';
    return 'var(--red)';
}

function computeStandings(t) {
    let pts = 0, gd = 0, gf = 0, gp = 0, w = 0, d = 0, l = 0;
    (t.played || []).forEach(m => {
        if (!m.score) return;
        const [a, b] = m.score.split('-').map(Number);
        gf += a; gd += a - b; gp++;
        if (m.wdl === 'W') { pts += 3; w++; }
        else if (m.wdl === 'D') { pts += 1; d++; }
        else l++;
    });
    return { pts, gd, gf, gp, w, d, l };
}

function badgeLabel(st) {
    const s = STRINGS[lang];
    return { qualified: s.badgeQ, alive: s.badgeA, eliminated: s.badgeE }[st];
}

// ── Popup ────────────────────────────────────────────────────────────────────
let openKey = null;

function togglePopup(pi, ti, cardEl) {
    const key = `${pi}-${ti}`;
    if (openKey === key) { closePopup(); return; }
    openKey = key;

    const team = teamByName[data.players[pi].teams[ti]];
    const popup = document.getElementById('popup');
    popup.innerHTML = buildPopup(team);
    positionPopup(cardEl);
    document.getElementById('popupOverlay').classList.add('active');
}

function togglePopupByName(name, el) {
    if (openKey === name) { closePopup(); return; }
    openKey = name;
    const team = teamByName[name];
    if (!team) return;
    document.getElementById('popup').innerHTML = buildPopup(team);
    positionPopup(el);
    document.getElementById('popupOverlay').classList.add('active');
}

function closePopup() {
    document.getElementById('popupOverlay').classList.remove('active');
    openKey = null;
}

function positionPopup(cardEl) {
    const popup = document.getElementById('popup');
    if (window.innerWidth <= 780) return; // CSS handles mobile (bottom sheet)

    const rect = cardEl.getBoundingClientRect();
    const pw = 268, ph = 280;
    let left = rect.left + rect.width / 2 - pw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));

    const spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow >= ph + 12) {
        popup.style.top  = (rect.bottom + 8) + 'px';
        popup.style.transform = 'translateY(0)';
    } else {
        popup.style.top  = (rect.top - 8) + 'px';
        popup.style.transform = 'translateY(-100%)';
    }
    popup.style.left   = left + 'px';
    popup.style.bottom = 'auto';
}

function buildPopup(team) {
    const s      = STRINGS[lang];
    const status = getStatus(team.qualifyPct);
    const pc     = pctColor(team.qualifyPct);

    let playedHtml = '';
    if (team.played && team.played.length) {
        playedHtml = `
        <div class="popup-section">
            <div class="popup-section-title">${s.popupResults}</div>
            ${team.played.map(m => `
                <div class="popup-match">
                    <span class="popup-date">${m.date}</span>
                    <span>vs ${m.vs}</span>
                    <span class="popup-score">${m.score}</span>
                    <span class="popup-wdl wdl-${m.wdl}">${m.wdl}</span>
                </div>`).join('')}
        </div>`;
    }

    let nextHtml = '';
    if (team.next && team.next.length && status !== 'eliminated') {
        nextHtml = `
        <div class="popup-section">
            <div class="popup-section-title">${s.popupUpcoming}</div>
            ${team.next.map(m => {
                const isToday = m.date === TODAY_DATE;
                return `
                <div class="popup-match">
                    <span class="popup-date">${m.date}</span>
                    ${isToday ? '<span class="today-badge">TODAY</span>' : ''}
                    <span>vs ${m.vs}</span>
                </div>`;
            }).join('')}
        </div>`;
    }

    const pctHtml = `
        <div class="popup-section">
            <div class="popup-section-title">${s.popupOdds}</div>
            <div class="pct-row">
                <div class="pct-bar-wrap">
                    <div class="pct-bar" style="width:${team.qualifyPct}%;background:${pc}"></div>
                </div>
                <div class="pct-num" style="color:${pc}">${team.qualifyPct}%</div>
            </div>
        </div>`;

    return `
        <div class="popup-header">
            ${flagImg(team.name, 'popup-flag')}
            <div>
                <div class="popup-title">${team.name}</div>
                <div class="popup-sub">${s.popupGroup(team.group, team.pot)}</div>
            </div>
            <button class="popup-close" onclick="closePopup()">×</button>
        </div>
        ${playedHtml}
        ${nextHtml}
        ${pctHtml}`;
}

// ── Filter & view ────────────────────────────────────────────────────────────
let filterText       = '';
let filterGroup      = '';
let viewMode         = 'player';
let rankingShowAlive = false;

function updateBoardHeader() {
    document.getElementById('boardHeader').style.display =
        (viewMode === 'group' || filterText || filterGroup) ? 'none' : '';
}

function setView(mode) {
    viewMode = mode;
    document.getElementById('vBtnPlayer').classList.toggle('active', mode === 'player');
    document.getElementById('vBtnGroup').classList.toggle('active', mode === 'group');
    document.getElementById('vBtnRanking').classList.toggle('active', mode === 'ranking');
    document.getElementById('groupChips').style.display = (mode === 'group' || mode === 'ranking') ? 'none' : '';
    document.getElementById('rankingChips').style.display = (mode === 'ranking') ? '' : 'none';
    updateBoardHeader();
    render();
}
function setFilter(val) {
    filterText = val.trim().toLowerCase();
    document.getElementById('filterClear').style.display = filterText ? '' : 'none';
    updateBoardHeader();
    render();
}
function setGroupFilter(g) {
    filterGroup = filterGroup === g ? '' : g;
    document.querySelectorAll('.group-chip').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.group === filterGroup));
    updateBoardHeader();
    render();
}
function toggleAliveFilter() {
    rankingShowAlive = !rankingShowAlive;
    document.getElementById('aliveFilterBtn').classList.toggle('active', rankingShowAlive);
    render();
}
function clearFilter() {
    filterText = '';
    filterGroup = '';
    document.getElementById('filterInput').value = '';
    document.getElementById('filterClear').style.display = 'none';
    document.querySelectorAll('.group-chip').forEach(btn => btn.classList.remove('active'));
    updateBoardHeader();
    render();
}
function renderExtras() {
    const section = document.getElementById('extrasSection');
    if (!filterGroup) { section.innerHTML = ''; return; }
    const teams = (data.extras || []).map(n => teamByName[n]).filter(t => t.group === filterGroup);
    if (teams.length === 0) { section.innerHTML = ''; return; }

    const cards = teams.map(t => {
        const st = getStatus(t.qualifyPct);
        const pc = pctColor(t.qualifyPct);
        const matchRows = [
            ...(t.played || []).map(m => `
                <div class="card-match">
                    <span class="card-date">${m.date}</span>
                    <span class="card-vs">vs ${m.vs}</span>
                    <span class="card-score">${m.score}</span>
                    <span class="card-wdl wdl-${m.wdl}">${m.wdl}</span>
                </div>`),
            ...(t.next || []).map(m => `
                <div class="card-match card-next">
                    <span class="card-date">${m.date}</span>
                    <span class="card-vs">vs ${m.vs}</span>
                    ${m.date === TODAY_DATE ? '<span class="today-badge">TODAY</span>' : ''}
                </div>`)
        ].join('');
        return `
        <div class="team-card s-${st} extra-card">
            <div class="card-left">
                ${flagImg(t.name, 'team-flag')}
                <div class="team-group">${STRINGS[lang].group(t.group)}</div>
                <div class="team-badge">${badgeLabel(st)}</div>
            </div>
            <div class="card-right">
                <div style="font-size:.58rem;color:var(--muted);margin-bottom:2px">— not picked —</div>
                ${matchRows}
                <div class="card-pct">
                    <div class="card-pct-bar-wrap">
                        <div class="card-pct-bar" style="width:${t.qualifyPct}%;background:${pc}"></div>
                    </div>
                    <span class="card-pct-num" style="color:${pc}">${t.qualifyPct}%</span>
                </div>
            </div>
        </div>`;
    }).join('');

    section.innerHTML = `
        <div class="extras-section">
            <div class="extras-header">Group ${filterGroup} — Other teams</div>
            <div class="extras-grid">${cards}</div>
        </div>`;
}

function renderGroupView() {
    const teamOwner = {};
    SEED.players.forEach(p => p.teams.forEach(n => { teamOwner[n] = p.name; }));

    const groups = {};
    Object.values(teamByName).forEach(t => {
        if (!groups[t.group]) groups[t.group] = [];
        groups[t.group].push(t);
    });

    const html = Object.keys(groups).sort().map(g => {
        const ranked = groups[g]
            .map(t => ({ t, ...computeStandings(t) }))
            .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);

        const visibleRows = ranked.filter(r =>
            !filterText || r.t.name.toLowerCase().includes(filterText));
        if (visibleRows.length === 0) return '';

        const rows = ranked.map((r, i) => {
            const t = r.t;
            if (filterText && !t.name.toLowerCase().includes(filterText)) return '';
            const st     = getStatus(t.qualifyPct);
            const owner  = teamOwner[t.name];
            const ownerDisplay = owner
                ? (lang === 'en' ? (PLAYER_EN[owner] || owner) : owner)
                : '—';
            const gdStr = r.gd > 0 ? `+${r.gd}` : `${r.gd}`;
            const divider = (i === 2 && !filterText)
                ? '<div class="gs-qual-divider"></div>' : '';
            return `${divider}
            <div class="gs-row s-${st}" data-team="${t.name}" onclick="togglePopupByName(this.dataset.team,this)">
                <span class="gs-rank${i < 2 ? ' top2' : ''}">${i + 1}</span>
                <div class="gs-team">
                    ${flagImg(t.name, 'gs-flag')}
                    <span class="gs-name">${t.name}</span>
                </div>
                <span class="gs-player ${owner ? 'owned' : ''}">${ownerDisplay}</span>
                <span class="gs-stat">${r.gp}</span>
                <span class="gs-stat gs-stat-w">${r.w}</span>
                <span class="gs-stat gs-stat-d">${r.d}</span>
                <span class="gs-stat gs-stat-l">${r.l}</span>
                <span class="gs-stat gd gs-stat-gd">${gdStr}</span>
                <span class="gs-stat pts">${r.pts}</span>
            </div>`;
        }).join('');

        return `
        <div class="gs-section">
            <div class="gs-header">
                <span class="gs-header-letter">${g}</span>
                <span>${STRINGS[lang].group(g)}</span>
            </div>
            <div class="gs-cols">
                <span></span><span>Team</span>
                <span>Player</span>
                <span>GP</span>
                <span class="gs-col-w">W</span>
                <span class="gs-col-d">D</span>
                <span class="gs-col-l">L</span>
                <span class="gs-col-gd">GD</span>
                <span>Pts</span>
            </div>
            ${rows}
        </div>`;
    }).join('');

    document.getElementById('board').innerHTML = `<div class="group-standings">${html}</div>`;
    document.getElementById('extrasSection').innerHTML = '';
    document.getElementById('footer').textContent =
        LAST_UPDATED ? STRINGS[lang].lastUpdated(LAST_UPDATED) : '';
}

function buildGroupChips() {
    const groups = [...new Set(
        data.players.flatMap(p => p.teams.map(n => teamByName[n].group))
    )].sort();
    document.getElementById('groupChips').innerHTML =
        '<span class="chip-label">Group:</span>' +
        groups.map(g =>
            `<button class="group-chip" data-group="${g}" onclick="setGroupFilter('${g}')">${g}</button>`
        ).join('');
}

// ── Render ───────────────────────────────────────────────────────────────────
const data = SEED;
window.addEventListener('load', () => { buildGroupChips(); applyLang(); });

function renderPointsView() {
    const teamOwner = {};
    SEED.players.forEach(p => p.teams.forEach(n => { teamOwner[n] = p.name; }));

    const ranked = Object.values(teamByName)
        .map(t => ({ t, ...computeStandings(t) }))
        .filter(r => (!filterText || r.t.name.toLowerCase().includes(filterText))
                  && (!rankingShowAlive || (r.t.qualifyPct > 0 && r.t.qualifyPct < 100)))
        .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);

    const rows = ranked.map((r, i) => {
        const t = r.t;
        const st = getStatus(t.qualifyPct);
        const owner = teamOwner[t.name];
        const ownerDisplay = owner ? (lang === 'en' ? (PLAYER_EN[owner] || owner) : owner) : '—';
        const gdStr = r.gd > 0 ? `+${r.gd}` : `${r.gd}`;
        const notPicked = !owner;
        return `
        <div class="gs-row s-${st}${notPicked ? ' gs-row-extra' : ''}" data-team="${t.name}" onclick="togglePopupByName(this.dataset.team,this)">
            <span class="gs-rank">${i + 1}</span>
            <div class="gs-team">
                ${flagImg(t.name, 'gs-flag')}
                <span class="gs-name">${t.name} <span style="font-size:.58rem;color:var(--muted)">(${t.group})</span></span>
            </div>
            <span class="gs-player ${owner ? 'owned' : ''}">${ownerDisplay}</span>
            <span class="gs-stat">${r.gp}</span>
            <span class="gs-stat gs-stat-w">${r.w}</span>
            <span class="gs-stat gs-stat-d">${r.d}</span>
            <span class="gs-stat gs-stat-l">${r.l}</span>
            <span class="gs-stat gd gs-stat-gd">${gdStr}</span>
            <span class="gs-stat pts">${r.pts}</span>
        </div>`;
    }).join('');

    document.getElementById('board').innerHTML = `
        <div class="group-standings">
            <div class="gs-section">
                <div class="gs-header"><span>🏅 All picks — Pts · GD</span></div>
                <div class="gs-cols">
                    <span></span><span>Team</span>
                    <span>Player</span><span>GP</span>
                    <span class="gs-col-w">W</span><span class="gs-col-d">D</span>
                    <span class="gs-col-l">L</span><span class="gs-col-gd">GD</span>
                    <span>Pts</span>
                </div>
                ${rows}
            </div>
        </div>`;
    document.getElementById('extrasSection').innerHTML = '';
    document.getElementById('footer').textContent =
        LAST_UPDATED ? STRINGS[lang].lastUpdated(LAST_UPDATED) : '';
}

function render() {
    if (viewMode === 'group') { renderGroupView(); return; }
    if (viewMode === 'ranking') { renderPointsView(); return; }
    const board = document.getElementById('board');

    board.innerHTML = data.players.map((p, pi) => {
        const teamVisible = n => {
            const t = teamByName[n];
            return (!filterText || n.toLowerCase().includes(filterText))
                && (!filterGroup || t.group === filterGroup);
        };
        if ((filterText || filterGroup) && !p.teams.some(teamVisible)) return '';

        const q = p.teams.filter(n => getStatus(teamByName[n].qualifyPct) === 'qualified').length;
        const a = p.teams.filter(n => getStatus(teamByName[n].qualifyPct) === 'alive').length;
        const e = p.teams.filter(n => getStatus(teamByName[n].qualifyPct) === 'eliminated').length;

        const cards = p.teams.map((tName, ti) => {
            const t = teamByName[tName];
            const hidden = (filterText || filterGroup) && !teamVisible(tName);
            const st  = getStatus(t.qualifyPct);
            const pc  = pctColor(t.qualifyPct);

            const matchRows = [
                ...(t.played || []).map(m => `
                    <div class="card-match">
                        <span class="card-date">${m.date}</span>
                        <span class="card-vs">vs ${m.vs}</span>
                        <span class="card-score">${m.score}</span>
                        <span class="card-wdl wdl-${m.wdl}">${m.wdl}</span>
                    </div>`),
                ...(t.next || []).map(m => `
                    <div class="card-match card-next">
                        <span class="card-date">${m.date}</span>
                        <span class="card-vs">vs ${m.vs}</span>
                        ${m.date === TODAY_DATE ? '<span class="today-badge">TODAY</span>' : ''}
                    </div>`)
            ].join('');

            return `
            <div class="team-card s-${st}"${hidden ? ' style="display:none"' : ''} onclick="togglePopup(${pi},${ti},this)">
                <div class="pot-lbl">P${t.pot}</div>
                <div class="card-left">
                    ${flagImg(t.name, 'team-flag')}
                    <div class="team-group">${STRINGS[lang].group(t.group)}</div>
                    <div class="team-badge">${badgeLabel(st)}</div>
                </div>
                <div class="card-right">
                    ${matchRows}
                    <div class="card-pct">
                        <div class="card-pct-bar-wrap">
                            <div class="card-pct-bar" style="width:${t.qualifyPct}%;background:${pc}"></div>
                        </div>
                        <span class="card-pct-num" style="color:${pc}">${t.qualifyPct}%</span>
                    </div>
                </div>
            </div>`;
        }).join('');

        return `
        <div class="player-row">
            <div class="player-name">${lang === 'en' ? (PLAYER_EN[p.name] || p.name) : p.name}</div>
            <div class="teams-wrap">${cards}</div>
            <div class="score-cell">
                <div class="score-big">${q}<span style="font-size:1rem;color:var(--muted)">/4</span></div>
                <div class="score-sub">${STRINGS[lang].scoreSub}</div>
                <div class="score-detail">${STRINGS[lang].scoreDetail(a, e)}</div>
            </div>
        </div>`;
    }).join('');

    renderExtras();
    document.getElementById('footer').textContent =
        LAST_UPDATED ? STRINGS[lang].lastUpdated(LAST_UPDATED) : '';
}
</script>
