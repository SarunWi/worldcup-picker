// ── Stats ────────────────────────────────────────────────────────────────────
function teamStats(t) {
    const played = t.played || [];
    const losses = played.filter(m => m.wdl === 'L').length;
    const ga     = played.reduce((s, m) => s + (parseInt(m.score.split('-')[1]) || 0), 0);
    const gp     = played.length;
    return { losses, ga, gp, score: losses * 1000 + ga };
}

// Flatten all teams with player info
function allTeamsRanked() {
    const list = [];
    SEED.players.forEach(p => {
        p.teams.forEach(t => {
            const stats = teamStats(t);
            list.push({ team: t, player: p.name, ...stats });
        });
    });
    list.sort((a, b) => b.score - a.score || a.team.name.localeCompare(b.team.name));
    return list;
}

function playerRanked() {
    const list = SEED.players.map(p => {
        let totalL = 0, totalGA = 0;
        let worstEntry = null, worstScore = -1;
        p.teams.forEach(t => {
            const s = teamStats(t);
            totalL  += s.losses;
            totalGA += s.ga;
            if (s.score > worstScore) { worstScore = s.score; worstEntry = t; }
        });
        return { name: p.name, totalL, totalGA, score: totalL * 1000 + totalGA, worstTeam: worstEntry };
    });
    list.sort((a, b) => b.score - a.score);
    return list;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
    const s   = STRINGS[lang];
    const all = allTeamsRanked();
    const top = all[0];

    document.getElementById('h-title').textContent = '💀 ' + s.title;
    document.getElementById('h-sub').textContent   = s.subtitle;
    document.getElementById('h-sb').textContent    = s.backBtn;
    document.getElementById('langBtn').textContent = lang === 'th' ? 'EN' : 'TH';

    // Crown
    const ts = top;
    const matchRows = (ts.team.played || []).map(m => `
        <div class="crown-match">
            <span class="crown-match-date">${m.date}</span>
            <span class="crown-match-vs">vs ${m.vs}</span>
            <span class="crown-match-score">${m.score}</span>
            <span class="crown-match-wdl wdl-${m.wdl}">${m.wdl}</span>
        </div>`).join('');

    document.getElementById('crownSection').innerHTML = `
        <div class="section-label sl-shame">${s.crownLabel}</div>
        <div class="shame-crown">
            ${flagImg(ts.team.name, 90)}
            <div class="crown-body">
                <div class="crown-team-name">${ts.team.name}</div>
                <div class="crown-meta">Group ${ts.team.group} · Pot ${ts.team.pot}</div>
                <div class="crown-owned">${s.crownOwned()} <strong>${pname(ts.player)}</strong></div>
                <div class="crown-divider"></div>
                <div class="crown-stats">
                    <div class="crown-stat">
                        <div class="crown-stat-val">${ts.losses}</div>
                        <div class="crown-stat-lbl">${s.crownLosses}</div>
                    </div>
                    <div class="crown-stat">
                        <div class="crown-stat-val">${ts.ga}</div>
                        <div class="crown-stat-lbl">${s.crownGA}</div>
                    </div>
                    <div class="crown-stat">
                        <div class="crown-stat-val">${ts.gp}</div>
                        <div class="crown-stat-lbl">${s.crownGP}</div>
                    </div>
                </div>
                ${matchRows ? `<div class="crown-matches">${matchRows}</div>` : ''}
            </div>
        </div>`;

    // Player leaderboard
    const players = playerRanked();
    const psRows = players.map((p, i) => {
        const isTop = i === 0;
        return `
        <div class="player-shame-row${isTop ? ' ps-top' : ''}">
            <div class="ps-rank">${i + 1}</div>
            <div>
                <div class="ps-name">${pname(p.name)}</div>
                <div class="ps-worst-team">${p.worstTeam ? p.worstTeam.name : '—'}</div>
            </div>
            <div class="ps-val ${p.totalL > 0 ? 'pv-bad' : 'pv-ok'}">${p.totalL}</div>
            <div class="ps-val ${p.totalGA > 0 ? 'pv-bad' : 'pv-ok'}">${p.totalGA}</div>
        </div>`;
    }).join('');

    document.getElementById('playerSection').innerHTML = `
        <div class="section-label sl-neutral" style="margin-top:8px">${s.playerLabel}</div>
        <div class="ps-header">
            <div></div>
            <div class="psh-left">${s.psPlayer}</div>
            <div style="text-align:center">${s.psTotalL}</div>
            <div style="text-align:center">${s.psTotalGA}</div>
        </div>
        <div class="player-shame-list">${psRows}</div>`;

    // Full team ranking
    const rankRows = all.map((entry, i) => {
        const rank = i + 1;
        const rankClass = rank === 1 ? 'r-1' : rank === 2 ? 'r-2' : rank === 3 ? 'r-3'
            : entry.score === 0 ? 'r-safe' : '';
        const rankIcon = rank === 1 ? '💀' : rank;
        return `
        <div class="rank-row ${rankClass}">
            <div class="rn">${rankIcon}</div>
            <div>${flagImg(entry.team.name, 30)}</div>
            <div class="rteam">${entry.team.name}</div>
            <div class="rplayer">${pname(entry.player)}</div>
            <div class="rv ok">${entry.gp}</div>
            <div class="rv ${entry.losses > 0 ? 'bad' : 'ok'}">${entry.losses}</div>
            <div class="rv ${entry.ga > 0 ? 'bad' : 'ok'}">${entry.ga}</div>
        </div>`;
    }).join('');

    document.getElementById('rankSection').innerHTML = `
        <div class="section-label sl-neutral">${s.rankLabel}</div>
        <div class="rank-header">
            <div class="rhc-left">${s.rankNum}</div>
            <div></div>
            <div class="rhc-left">${s.rankTeam}</div>
            <div class="rhc-left">${s.rankPlayer}</div>
            <div>${s.rankGP}</div>
            <div>${s.rankL}</div>
            <div>${s.rankGA}</div>
        </div>
        <div class="rank-list">${rankRows}</div>`;

    document.getElementById('footer').textContent =
        SEED.lastUpdated ? s.lastUpdated(SEED.lastUpdated) : '';
}

window.addEventListener('load', render);
</script>
</body>
</html>
