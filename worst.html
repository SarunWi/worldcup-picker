<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worst Pick 2026</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:     #0d1b2a;
            --card:   #162231;
            --border: #243447;
            --green:  #4caf50;
            --gold:   #ffd700;
            --text:   #dce8f0;
            --muted:  #5a7080;
            --yellow: #f9a825;
            --red:    #e53935;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

        header {
            background: linear-gradient(135deg, #190505, #2c0d0d);
            border-bottom: 2px solid var(--red);
            padding: 14px 20px;
        }
        .header-inner {
            max-width: 900px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        header h1 { font-size: 1.4rem; font-weight: 700; }
        .header-sub { color: var(--muted); font-size: .78rem; margin-top: 3px; }
        .back-btn {
            background: #1a2e3e; border: 1px solid var(--border);
            color: var(--text); padding: 7px 14px; border-radius: 7px;
            text-decoration: none; font-size: .82rem;
        }
        .back-btn:hover { border-color: var(--red); }
        .lang-btn {
            background: #1a2e3e; border: 1px solid var(--border);
            color: var(--text); padding: 7px 14px; border-radius: 7px;
            font-size: .82rem; cursor: pointer; font-weight: 700; letter-spacing: 1px;
        }
        .lang-btn:hover { border-color: var(--red); }

        .main { max-width: 900px; margin: 0 auto; padding: 16px; }

        /* Section labels */
        .section-label {
            font-size: .68rem; text-transform: uppercase; letter-spacing: 1.5px;
            font-weight: 700; margin-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; }
        .sl-shame { color: var(--red); }
        .sl-shame::after { background: rgba(229,57,53,.28); }
        .sl-neutral { color: var(--muted); }
        .sl-neutral::after { background: var(--border); }

        /* Shame crown */
        .shame-crown {
            background: linear-gradient(135deg, #1c0606, #200e0e);
            border: 2px solid var(--red);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            gap: 22px;
            align-items: flex-start;
            box-shadow: 0 0 32px rgba(229,57,53,.12);
        }
        .crown-flag { width: 90px; height: auto; border-radius: 5px; box-shadow: 0 2px 14px rgba(0,0,0,.6); flex-shrink: 0; margin-top: 2px; }
        .crown-body { flex: 1; min-width: 0; }
        .crown-team-name { font-size: 1.75rem; font-weight: 900; line-height: 1; }
        .crown-meta { color: var(--muted); font-size: .78rem; margin-top: 4px; }
        .crown-owned { margin-top: 10px; font-size: .88rem; }
        .crown-owned strong { color: var(--red); font-size: 1.05rem; }
        .crown-divider { height: 1px; background: rgba(229,57,53,.2); margin: 14px 0; }
        .crown-stats { display: flex; gap: 28px; }
        .crown-stat-val { font-size: 2.2rem; font-weight: 900; color: var(--red); line-height: 1; }
        .crown-stat-lbl { font-size: .58rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-top: 3px; }
        .crown-matches { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
        .crown-match { display: flex; align-items: center; gap: 8px; font-size: .82rem; }
        .crown-match-date { color: var(--muted); font-size: .72rem; width: 50px; flex-shrink: 0; }
        .crown-match-vs { flex: 1; }
        .crown-match-score { font-weight: 700; flex-shrink: 0; }
        .crown-match-wdl { font-size: .65rem; font-weight: 900; padding: 1px 5px; border-radius: 4px; flex-shrink: 0; }
        .wdl-W { background: rgba(76,175,80,.2);   color: var(--green); }
        .wdl-D { background: rgba(249,168,37,.15); color: var(--yellow); }
        .wdl-L { background: rgba(229,57,53,.2);   color: var(--red); }

        /* Team ranking */
        .rank-header, .rank-row {
            display: grid;
            grid-template-columns: 36px 38px 1fr 76px 28px 28px 28px 28px;
            gap: 6px;
            padding: 0 10px;
            align-items: center;
        }
        .rank-header {
            padding-bottom: 6px;
            font-size: .6rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .8px; color: var(--muted); text-align: center;
        }
        .rank-header .rhc-left { text-align: left; }
        .rank-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
        .rank-row {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding-top: 8px; padding-bottom: 8px;
            font-size: .82rem;
        }
        .rank-row.r-1 { border-color: var(--red); background: rgba(229,57,53,.07); }
        .rank-row.r-2 { border-color: rgba(229,57,53,.45); }
        .rank-row.r-3 { border-color: rgba(229,57,53,.22); }
        .rank-row.r-safe { opacity: .5; }
        .rn { font-weight: 900; font-size: .85rem; color: var(--muted); text-align: center; }
        .r-1 .rn { color: var(--red); font-size: 1rem; }
        .rflag { width: 30px; height: auto; border-radius: 2px; display: block; }
        .rteam { font-weight: 600; font-size: .82rem; }
        .rplayer { font-size: .68rem; color: var(--muted); margin-top: 1px; }
        .rv { text-align: center; font-weight: 700; }
        .rv.bad { color: var(--red); }
        .rv.ok  { color: var(--muted); }

        .footer {
            text-align: center; color: var(--muted); font-size: .73rem;
            margin-top: 18px; padding-bottom: 20px;
        }

        @media (max-width: 600px) {
            .shame-crown { flex-direction: column; gap: 14px; }
            .crown-flag  { width: 72px; }
            .rank-header { display: none; }
            .rank-row {
                /* drop GP column on mobile */
                grid-template-columns: 28px 30px 1fr 52px 24px 24px 24px;
            }
            .rank-row > :nth-child(5) { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div>
            <h1 id="h-title">💀 Worst Pick 2026</h1>
            <div class="header-sub" id="h-sub"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
            <a class="back-btn" href="scoreboard.html" id="h-sb">← Scoreboard</a>
            <a class="back-btn" href="bracket.html">🏆 Bracket</a>
            <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
        </div>
    </div>
</header>

<div class="main">
    <div id="crownSection"></div>
    <div id="rankSection"></div>
    <div class="footer" id="footer"></div>
</div>

<script src="teams.js"></script>
<script>

const FLAG_CODES = {
    "Belgium":"be","Morocco":"ma","Qatar":"qa","DR Congo":"cd",
    "Argentina":"ar","Japan":"jp","Scotland":"gb-sct","New Zealand":"nz",
    "France":"fr","Uruguay":"uy","Tunisia":"tn","Cabo Verde":"cv",
    "Spain":"es","Croatia":"hr","South Africa":"za","Jordan":"jo",
    "Germany":"de","Australia":"au","Algeria":"dz","Ghana":"gh",
    "England":"gb-eng","Austria":"at","Paraguay":"py","Curaçao":"cw",
    "Netherlands":"nl","Switzerland":"ch","Norway":"no","Haiti":"ht",
    "Portugal":"pt","Senegal":"sn","Uzbekistan":"uz","Iraq":"iq",
    "Brazil":"br","Ecuador":"ec","Egypt":"eg","Turkey":"tr"
};

function flagImg(name, w) {
    const code = FLAG_CODES[name];
    if (!code) return `<span style="font-size:1.4rem">🏳️</span>`;
    return `<img src="https://flagcdn.com/w80/${code}.png" alt="${name}" loading="lazy" style="width:${w}px;height:auto;border-radius:3px;display:block">`;
}

const PLAYER_EN = {
    "ก้อง":"Kong","แว่น":"OakVaan","มิว":"Mew",
    "นุ":"Nuu","ตือ":"Oou","พิม":"Pim",
    "บลู":"Chablue","อาม":"Arm","เรีย":"Lea"
};

const STRINGS = {
    th: {
        title:      "Worst Pick 2026",
        subtitle:   "ทีมที่แย่ที่สุดจะได้รับรางวัลพิเศษ — นับจากแพ้ · ประตูที่เสีย · ประตูที่ทำได้",
        backBtn:    "← หน้าสรุป",
        crownLabel: "💀 แชมป์ความอับอาย (ตอนนี้)",
        crownOwned: (name) => `ของ`,
        crownLosses:  "ครั้งที่แพ้",
        crownGA:      "ประตูที่เสีย",
        crownGF:      "ประตูที่ทำได้",
        crownGP:      "นัดที่แข่ง",
        rankLabel:    "🏴 อันดับความแย่ — ทุกทีม",
        rankNum:      "#",
        rankTeam:     "ทีม",
        rankPlayer:   "ผู้เล่น",
        rankGP:       "GP",
        rankL:        "L",
        rankGA:       "GA",
        rankGF:       "GF",
        lastUpdated:  d => `อัปเดตล่าสุด: ${d}`,
    },
    en: {
        title:      "Worst Pick 2026",
        subtitle:   "The worst team wins the shame award — ranked by losses · goals conceded · goals scored",
        backBtn:    "← Scoreboard",
        crownLabel: "💀 Current Shame Champion",
        crownOwned: (name) => `Owned by`,
        crownLosses:  "Losses",
        crownGA:      "Goals conceded",
        crownGF:      "Goals scored",
        crownGP:      "Played",
        rankLabel:    "🏴 Shame Ranking — All Teams",
        rankNum:      "#",
        rankTeam:     "Team",
        rankPlayer:   "Player",
        rankGP:       "GP",
        rankL:        "L",
        rankGA:       "GA",
        rankGF:       "GF",
        lastUpdated:  d => `Last updated: ${d}`,
    }
};

let lang = localStorage.getItem('wc-lang') || 'th';

function toggleLang() {
    lang = lang === 'th' ? 'en' : 'th';
    localStorage.setItem('wc-lang', lang);
    render();
}

function pname(thName) {
    return lang === 'en' ? (PLAYER_EN[thName] || thName) : thName;
}

// Player-team assignments — never changes after draft.
// Match data lives in teams.js (teamByName). Update that file only.
const SEED = {
    players: [
        { name:"ก้อง",  teams:["Belgium","Morocco","Qatar","DR Congo"] },
        { name:"แว่น",  teams:["Argentina","Japan","Scotland","New Zealand"] },
        { name:"มิว",   teams:["France","Uruguay","Tunisia","Cabo Verde"] },
        { name:"นุ",    teams:["Spain","Croatia","South Africa","Jordan"] },
        { name:"ตือ",   teams:["Germany","Australia","Algeria","Ghana"] },
        { name:"พิม",   teams:["England","Austria","Paraguay","Curaçao"] },
        { name:"บลู",   teams:["Netherlands","Switzerland","Norway","Haiti"] },
        { name:"อาม",   teams:["Portugal","Senegal","Uzbekistan","Iraq"] },
        { name:"เรีย",  teams:["Brazil","Ecuador","Egypt","Turkey"] },
    ],
};

// ── Stats ────────────────────────────────────────────────────────────────────
function teamStats(t) {
    const played = t.played || [];
    const losses = played.filter(m => m.wdl === 'L').length;
    const ga     = played.reduce((s, m) => s + (parseInt(m.score.split('-')[1]) || 0), 0);
    const gf     = played.reduce((s, m) => s + (parseInt(m.score.split('-')[0]) || 0), 0);
    const gp     = played.length;
    return { losses, ga, gf, gp };
}

// Flatten all teams with player info, sorted worst first
// Tiebreaker order: losses DESC → GA DESC → GF ASC (fewer goals = more shameful)
function allTeamsRanked() {
    const list = [];
    SEED.players.forEach(p => {
        p.teams.forEach(tName => {
            const t = teamByName[tName];
            list.push({ team: t, player: p.name, ...teamStats(t) });
        });
    });
    list.sort((a, b) => {
        if (b.losses !== a.losses) return b.losses - a.losses;
        if (b.ga     !== a.ga)     return b.ga - a.ga;
        if (a.gf     !== b.gf)     return a.gf - b.gf;
        return a.team.name.localeCompare(b.team.name);
    });
    return list;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
    const s   = STRINGS[lang];
    const all = allTeamsRanked();
    const top = all[0];

    document.getElementById('h-title').textContent = '💀 ' + s.title;
    document.getElementById('h-sub').textContent   = s.subtitle;
    document.getElementById('h-sb').textContent    = s.backBtn;
    document.getElementById('langBtn').textContent = lang === 'th' ? 'EN' : 'TH';

    // Crown
    const ts = top;
    const matchRows = (ts.team.played || []).map(m => `
        <div class="crown-match">
            <span class="crown-match-date">${m.date}</span>
            <span class="crown-match-vs">vs ${m.vs}</span>
            <span class="crown-match-score">${m.score}</span>
            <span class="crown-match-wdl wdl-${m.wdl}">${m.wdl}</span>
        </div>`).join('');

    document.getElementById('crownSection').innerHTML = `
        <div class="section-label sl-shame">${s.crownLabel}</div>
        <div class="shame-crown">
            ${flagImg(ts.team.name, 90)}
            <div class="crown-body">
                <div class="crown-team-name">${ts.team.name}</div>
                <div class="crown-meta">Group ${ts.team.group} · Pot ${ts.team.pot}</div>
                <div class="crown-owned">${s.crownOwned()} <strong>${pname(ts.player)}</strong></div>
                <div class="crown-divider"></div>
                <div class="crown-stats">
                    <div class="crown-stat">
                        <div class="crown-stat-val">${ts.losses}</div>
                        <div class="crown-stat-lbl">${s.crownLosses}</div>
                    </div>
                    <div class="crown-stat">
                        <div class="crown-stat-val">${ts.ga}</div>
                        <div class="crown-stat-lbl">${s.crownGA}</div>
                    </div>
                    <div class="crown-stat">
                        <div class="crown-stat-val">${ts.gf}</div>
                        <div class="crown-stat-lbl">${s.crownGF}</div>
                    </div>
                    <div class="crown-stat">
                        <div class="crown-stat-val">${ts.gp}</div>
                        <div class="crown-stat-lbl">${s.crownGP}</div>
                    </div>
                </div>
                ${matchRows ? `<div class="crown-matches">${matchRows}</div>` : ''}
            </div>
        </div>`;

    // Full team ranking
    const rankRows = all.map((entry, i) => {
        const rank = i + 1;
        const isSafe = entry.losses === 0 && entry.ga === 0;
        const rankClass = rank === 1 ? 'r-1' : rank === 2 ? 'r-2' : rank === 3 ? 'r-3'
            : isSafe ? 'r-safe' : '';
        const rankIcon = rank === 1 ? '💀' : rank;
        return `
        <div class="rank-row ${rankClass}">
            <div class="rn">${rankIcon}</div>
            <div>${flagImg(entry.team.name, 30)}</div>
            <div class="rteam">${entry.team.name}</div>
            <div class="rplayer">${pname(entry.player)}</div>
            <div class="rv ok">${entry.gp}</div>
            <div class="rv ${entry.losses > 0 ? 'bad' : 'ok'}">${entry.losses}</div>
            <div class="rv ${entry.ga > 0 ? 'bad' : 'ok'}">${entry.ga}</div>
            <div class="rv ok">${entry.gf}</div>
        </div>`;
    }).join('');

    document.getElementById('rankSection').innerHTML = `
        <div class="section-label sl-neutral">${s.rankLabel}</div>
        <div class="rank-header">
            <div class="rhc-left">${s.rankNum}</div>
            <div></div>
            <div class="rhc-left">${s.rankTeam}</div>
            <div class="rhc-left">${s.rankPlayer}</div>
            <div>${s.rankGP}</div>
            <div>${s.rankL}</div>
            <div>${s.rankGA}</div>
            <div>${s.rankGF}</div>
        </div>
        <div class="rank-list">${rankRows}</div>`;

    document.getElementById('footer').textContent =
        LAST_UPDATED ? s.lastUpdated(LAST_UPDATED) : '';
}

window.addEventListener('load', render);
</script>
</body>
</html>
