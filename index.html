<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 Team Picker</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:     #0d1b2a;
            --card:   #162231;
            --border: #243447;
            --green:  #4caf50;
            --gold:   #ffd700;
            --text:   #dce8f0;
            --muted:  #5a7080;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #071810, #0f2a14);
            border-bottom: 2px solid var(--green);
            padding: 14px 20px;
            text-align: center;
        }
        header h1 { font-size: 1.7rem; font-weight: 700; }
        header p  { color: var(--muted); margin-top: 3px; font-size: 0.85rem; }

        .layout {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            gap: 14px;
            max-width: 1080px;
            margin: 0 auto;
            padding: 14px;
        }
        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; }
            .wheel-col { order: -1; }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--green);
            margin-bottom: 10px;
        }

        .input-row { display: flex; gap: 7px; }
        input[type=text] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            padding: 7px 10px;
            font-size: 0.85rem;
        }
        input[type=text]:focus { outline: none; border-color: var(--green); }

        .btn {
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 7px 13px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: filter .15s;
        }
        .btn:hover:not(:disabled) { filter: brightness(1.15); }
        .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
        .btn-red { background: #b71c1c; }
        .btn-red:hover:not(:disabled) { filter: brightness(1.2); }

        .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 3px 9px;
            font-size: 0.78rem;
        }
        .chip.active { border-color: var(--gold); color: var(--gold); }
        .chip-x {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }
        .chip-x:hover { color: #e53935; }

        /* ── Wheel column ── */
        .wheel-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-wrap {
            position: relative;
            width: 460px;
            height: 460px;
        }
        @media (max-width: 520px) {
            .wheel-wrap { width: 310px; height: 310px; }
        }
        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 32px solid var(--gold);
            filter: drop-shadow(0 2px 6px rgba(0,0,0,.7));
            z-index: 5;
        }
        canvas {
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(76,175,80,.18), 0 0 110px rgba(76,175,80,.08);
        }

        .spin-btn {
            margin-top: 16px;
            padding: 12px 42px;
            font-size: 1.05rem;
            border-radius: 28px;
            letter-spacing: 2px;
            box-shadow: 0 4px 18px rgba(76,175,80,.35);
        }

        .announce {
            margin-top: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
            text-align: center;
            min-height: 1.8em;
            letter-spacing: .3px;
        }
        @keyframes pop {
            0%   { transform: scale(.7); opacity: 0; }
            65%  { transform: scale(1.08); }
            100% { transform: scale(1);  opacity: 1; }
        }
        .pop { animation: pop .4s ease both; }

        .next-lbl { margin-top: 7px; font-size: .82rem; color: var(--muted); }
        .next-lbl strong { color: #81d4fa; }

        /* ── Results ── */
        .results-scroll { max-height: 340px; overflow-y: auto; }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            padding: 7px 9px;
            border-radius: 7px;
            margin-bottom: 5px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: .78rem;
        }
        .r-name  { color: var(--green); font-weight: 700; white-space: nowrap; }
        .r-teams { color: #99aab5; text-align: right; line-height: 1.5; }

        /* ── Teams sidebar ── */
        .t-counter { font-size: .75rem; color: var(--muted); margin-bottom: 7px; }
        .t-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 380px;
            overflow-y: auto;
        }
        .t-tag {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 2px 7px;
            font-size: .7rem;
            color: #99aab5;
            transition: opacity .3s;
        }
        .t-tag.used { opacity: .28; text-decoration: line-through; }

        .empty { color: var(--muted); font-size: .8rem; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>

<header>
    <h1>⚽ World Cup 2026 Team Picker</h1>
    <p>Add your friends, then spin to assign each a team — good luck!</p>
</header>

<div class="layout">

    <!-- ── LEFT ── -->
    <div>
        <div class="card">
            <div class="card-title">Players</div>
            <div class="input-row">
                <input type="text" id="nameInput" placeholder="Enter name…" maxlength="22">
                <button class="btn" onclick="addPlayer()">Add</button>
            </div>
            <div class="chips" id="playerChips">
                <span class="empty">Add players to get started.</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Results</div>
            <div class="results-scroll" id="resultsList">
                <span class="empty">No picks yet.</span>
            </div>
        </div>

        <button class="btn btn-red" onclick="resetAll()" style="width:100%;margin-top:2px;">
            Reset Everything
        </button>
    </div>

    <!-- ── WHEEL ── -->
    <div class="wheel-col">
        <div class="wheel-wrap" id="wheelWrap">
            <div class="pointer"></div>
            <canvas id="wc"></canvas>
        </div>

        <div class="announce" id="announce"></div>
        <button class="btn spin-btn" id="spinBtn" onclick="startSpin()">SPIN!</button>
        <div class="next-lbl" id="nextLbl"></div>
    </div>

    <!-- ── RIGHT ── -->
    <div>
        <div class="card">
            <div class="card-title">Teams</div>
            <div class="t-counter" id="tCounter"></div>
            <div class="t-list" id="tList"></div>
        </div>
    </div>

</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────

const ALL_TEAMS = [
    // CONCACAF (hosts + 3)
    "USA","Canada","Mexico","Panama","Costa Rica","Jamaica",
    // UEFA (16)
    "Germany","France","Spain","Portugal","England","Netherlands",
    "Belgium","Italy","Croatia","Switzerland","Austria","Denmark",
    "Serbia","Scotland","Turkey","Poland",
    // CONMEBOL (6)
    "Argentina","Brazil","Colombia","Uruguay","Ecuador","Paraguay",
    // CAF (9)
    "Morocco","Senegal","Nigeria","Egypt","Cameroon",
    "South Africa","Ghana","Ivory Coast","Algeria",
    // AFC (8)
    "Japan","South Korea","Saudi Arabia","Iran",
    "Australia","Iraq","Jordan","Qatar",
    // OFC (1)
    "New Zealand",
    // Inter-confederation playoffs (2)
    "Venezuela","Uzbekistan"
];

const PALETTE = [
    "#c0392b","#e67e22","#f39c12","#16a085","#27ae60",
    "#2980b9","#8e44ad","#e91e63","#00897b","#ff7043",
    "#43a047","#1e88e5","#7b1fa2","#00838f","#d32f2f",
    "#039be5","#2e7d32","#6a1b9a","#00838f","#bf360c"
];

// ── State ─────────────────────────────────────────────────────────────────────

let players     = [];
let picks       = [];    // [{player, team}]
let curIdx      = 0;     // wraps over players[]
let rotation    = 0;
let spinning    = false;
let pendingTeam = null;

// ── Canvas setup ──────────────────────────────────────────────────────────────

const canvas = document.getElementById('wc');
const ctx    = canvas.getContext('2d');

function setupCanvas() {
    const wrap = document.getElementById('wheelWrap');
    const sz = wrap.clientWidth || 460;
    canvas.width  = sz;
    canvas.height = sz;
}

window.addEventListener('load', () => { setupCanvas(); renderUI(); });
window.addEventListener('resize', () => { setupCanvas(); drawWheel(rotation); });

// ── Drawing ───────────────────────────────────────────────────────────────────

function remaining() {
    const used = new Set(picks.map(p => p.team));
    return ALL_TEAMS.filter(t => !used.has(t));
}

function drawWheel(rot) {
    const W  = canvas.width;
    const cx = W / 2, cy = W / 2, r = W / 2 - 8;

    ctx.clearRect(0, 0, W, W);

    const rem = remaining();

    if (rem.length === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = '#162231';
        ctx.fill();
        ctx.fillStyle = '#aaa';
        ctx.font = `bold ${W * .045}px Segoe UI`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('All Done! 🎉', cx, cy);
        return;
    }

    const n   = rem.length;
    const seg = (Math.PI * 2) / n;

    for (let i = 0; i < n; i++) {
        const a0 = rot + i * seg;
        const a1 = a0 + seg;

        // Segment fill
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, a0, a1);
        ctx.closePath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.22)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Label (radiate outward from center)
        const mid  = a0 + seg / 2;
        const fSz  = Math.max(7, Math.min(12, Math.floor(W * seg * .13)));

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(mid);
        ctx.textAlign    = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = 'rgba(255,255,255,.93)';
        ctx.shadowColor  = 'rgba(0,0,0,.75)';
        ctx.shadowBlur   = 3;
        ctx.font = `bold ${fSz}px Arial, sans-serif`;

        let label = rem[i];
        const cap = n > 32 ? 9 : (n > 20 ? 12 : 16);
        if (label.length > cap) label = label.slice(0, cap - 1) + '…';
        ctx.fillText(label, r - 9, 0);
        ctx.restore();
    }

    // Outer border
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Center cap
    const capR = Math.max(14, W * .038);
    ctx.beginPath();
    ctx.arc(cx, cy, capR, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(cx - capR * .3, cy - capR * .3, 1, cx, cy, capR);
    g.addColorStop(0, '#3a3a3a');
    g.addColorStop(1, '#0d1b2a');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 2;
    ctx.stroke();
}

// ── Spin animation ────────────────────────────────────────────────────────────

let aFrom = 0, aTo = 0, aDur = 4000, aStart = null;

function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

function animFrame(ts) {
    if (!aStart) aStart = ts;
    const t    = Math.min((ts - aStart) / aDur, 1);
    const ease = easeOut(t);
    rotation = aFrom + (aTo - aFrom) * ease;
    drawWheel(rotation);
    if (t < 1) {
        requestAnimationFrame(animFrame);
    } else {
        rotation = aTo % (Math.PI * 2);
        if (rotation < 0) rotation += Math.PI * 2;
        spinning = false;
        finishSpin();
    }
}

function startSpin() {
    if (spinning) return;
    if (players.length === 0) { alert('Add at least one player first!'); return; }

    const rem = remaining();
    if (rem.length === 0) { alert('All teams have been assigned!'); return; }

    // Choose random winner
    const idx   = Math.floor(Math.random() * rem.length);
    pendingTeam = rem[idx];

    const n   = rem.length;
    const seg = (Math.PI * 2) / n;

    // Target: centre of chosen segment lands under pointer (top = -PI/2)
    const ideal = -Math.PI / 2 - idx * seg - seg / 2;
    let delta   = ideal - rotation;
    const minRot = (4 + Math.random() * 3) * Math.PI * 2;
    while (delta < minRot) delta += Math.PI * 2;

    aFrom  = rotation;
    aTo    = rotation + delta;
    aDur   = 3200 + Math.random() * 1100;
    aStart = null;

    spinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('announce').textContent = '';
    requestAnimationFrame(animFrame);
}

function finishSpin() {
    const player = players[curIdx % players.length];
    picks.push({ player, team: pendingTeam });
    curIdx++;

    const ann = document.getElementById('announce');
    ann.textContent = `🎉 ${player} gets ${pendingTeam}!`;
    ann.classList.remove('pop');
    void ann.offsetWidth;
    ann.classList.add('pop');

    renderUI();

    const rem = remaining();
    const btn = document.getElementById('spinBtn');
    if (rem.length > 0) {
        btn.disabled = false;
    } else {
        btn.textContent = 'All Done! 🎉';
    }
}

// ── Player management ─────────────────────────────────────────────────────────

function addPlayer() {
    const inp  = document.getElementById('nameInput');
    const name = inp.value.trim();
    if (!name) return;
    if (players.includes(name)) { alert(`"${name}" is already added.`); return; }
    players.push(name);
    inp.value = '';
    inp.focus();
    renderUI();
}

function removePlayer(name) {
    players = players.filter(p => p !== name);
    if (players.length > 0 && curIdx >= players.length) curIdx = 0;
    renderUI();
}

function resetAll() {
    if (!confirm('Clear all picks and start fresh?')) return;
    picks   = [];
    curIdx  = 0;
    rotation = 0;
    spinning = false;
    document.getElementById('announce').textContent = '';
    const btn = document.getElementById('spinBtn');
    btn.disabled = false;
    btn.textContent = 'SPIN!';
    setupCanvas();
    renderUI();
}

// ── Render UI ─────────────────────────────────────────────────────────────────

function renderUI() {
    // Player chips
    const chipsEl = document.getElementById('playerChips');
    if (players.length === 0) {
        chipsEl.innerHTML = '<span class="empty">Add players to get started.</span>';
    } else {
        chipsEl.innerHTML = players.map((p, i) => {
            const active = (curIdx % players.length) === i;
            const n      = picks.filter(pk => pk.player === p).length;
            const badge  = n ? ` <em style="font-size:.68rem;color:#aaa">(${n})</em>` : '';
            const safeName = p.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return `<span class="chip${active ? ' active' : ''}">
                ${p}${badge}
                <button class="chip-x" onclick="removePlayer('${safeName}')" title="Remove">×</button>
            </span>`;
        }).join('');
    }

    // "Spinning for" label
    const lblEl = document.getElementById('nextLbl');
    if (players.length > 0) {
        const next = players[curIdx % players.length];
        lblEl.innerHTML = `Spinning for: <strong>${next}</strong>`;
    } else {
        lblEl.textContent = '';
    }

    // Results grouped by player
    const rlEl = document.getElementById('resultsList');
    if (picks.length === 0) {
        rlEl.innerHTML = '<span class="empty">No picks yet.</span>';
    } else {
        const byPlayer = {};
        picks.forEach(pk => {
            (byPlayer[pk.player] = byPlayer[pk.player] || []).push(pk.team);
        });
        rlEl.innerHTML = Object.entries(byPlayer).map(([p, ts]) =>
            `<div class="result-row">
                <span class="r-name">${p}</span>
                <span class="r-teams">${ts.join('<br>')}</span>
            </div>`
        ).join('');
    }

    // Teams sidebar
    const used = new Set(picks.map(pk => pk.team));
    const rem  = ALL_TEAMS.length - used.size;
    document.getElementById('tCounter').textContent = `${rem} of ${ALL_TEAMS.length} remaining`;
    document.getElementById('tList').innerHTML = ALL_TEAMS.map(t =>
        `<span class="t-tag${used.has(t) ? ' used' : ''}">${t}</span>`
    ).join('');

    drawWheel(rotation);
}

// Enter key support
document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addPlayer();
});
</script>
</body>
</html>
